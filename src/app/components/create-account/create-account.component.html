<div class="container">
  <h2>Create New Account</h2>
  <button class="btn btn-primary" (click)="createAccount()">Create Account</button>

  <div *ngIf="accountCreated" class="mt-3">
    <p class="alert alert-success">Account created successfully!</p>
    <p>Card Number: {{ newAccount.cardNumber }}</p>
    <a routerLink="/home" class="btn btn-link">View Dashboard</a>
  </div>

  <div *ngIf="errorMessage" class="mt-3 alert alert-danger">
    {{ errorMessage }}
  </div>
</div>
