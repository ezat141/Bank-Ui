<div class="container">
  <h2>Users</h2>
  <table class="table" *ngIf="users.length > 0; else noUsers">
    <thead>
      <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Phone Number</th>
        <th>City</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.id }}</td>
        <td>{{ user.firstName }}</td>
        <td>{{ user.lastName }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.phoneNumber }}</td>
        <td>{{ user.city }}</td>
        <td>{{ user.status ? 'Active' : 'Inactive' }}</td>
        <td>
          <button *ngIf="user.status" (click)="deactivateUser(user.id)" class="btn btn-warning btn-sm">Deactivate</button>
          <button *ngIf="!user.status" (click)="activateUser(user.id)" class="btn btn-success btn-sm">Activate</button>
      
        </td>
      </tr>
    </tbody>
  </table>
  <ng-template #noUsers>
    <p>No users available.</p>
  </ng-template>
</div>
